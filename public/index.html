<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie-Talkie</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1e1e2e;
            color: #ffffff;
            user-select: none;
        }

        h1 {
            margin-bottom: 5px;
        }

        #userDisplay {
            margin-bottom: 2px;
            font-size: 14px;
            color: #f38ba8;
        }

        #connectionStatus {
            margin-bottom: 15px;
            font-size: 12px;
            color: #a6adc8;
        }

        /* Panel de usuarios en línea */
        #onlineBox {
            background-color: #252538;
            border: 1px solid #313145;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
            width: 250px;
            text-align: center;
        }

        #onlineBox h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #a6e3a1;
        }

        #usersList {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
            color: #cdd6f4;
        }

        #usersList li {
            padding: 3px 0;
        }

        #talkBtn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            background-color: #e74c3c;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #talkBtn:active {
            transform: scale(0.95);
            background-color: #c0392b;
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #a6adc8;
        }
    </style>
</head>
<body>

    <h1>Walkie-Talkie</h1>
    <p id="userDisplay">Conectando...</p>
    <p id="connectionStatus">Estado: Conectando a la red...</p>
    
    <!-- Cuadro de usuarios conectados -->
    <div id="onlineBox">
        <h3>🟢 En línea</h3>
        <ul id="usersList">
            <li>Cargando...</li>
        </ul>
    </div>

    <button id="talkBtn">PRESIONA PARA HABLAR</button>
    <p id="status">Toca el botón para activar el audio</p>

    <!-- Reproductor de audio invisible -->
    <audio id="audioPlayer" style="display: none;"></audio>

    <!-- Librería cliente de Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const talkBtn = document.getElementById('talkBtn');
        const statusText = document.getElementById('status');
        const userDisplay = document.getElementById('userDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        const usersList = document.getElementById('usersList');
        const audioPlayer = document.getElementById('audioPlayer');

        let username = prompt("Ingresa tu nombre para el Walkie-Talkie:", "Iván");
        if (!username || username.trim() === "") {
            username = "Anónimo_" + Math.floor(Math.random() * 1000);
        }
        userDisplay.innerText = `Usuario: ${username}`;

        socket.on('connect', () => {
            connectionStatus.innerText = "Estado: Conectado (En línea)";
            connectionStatus.style.color = "#a6e3a1";
            socket.emit('register-username', username);
        });

        socket.on('disconnect', () => {
            connectionStatus.innerText = "Estado: Desconectado (Reconectando...)";
            connectionStatus.style.color = "#f38ba8";
        });

        socket.on('update-user-list', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.innerText = user === username ? `${user} (Tú)` : user;
                usersList.appendChild(li);
            });
        });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    const wakeLock = await navigator.wakeLock.request('screen');
                    document.addEventListener('visibilitychange', async () => {
                        if (wakeLock !== null && document.visibilityState === 'visible') {
                            await navigator.wakeLock.request('screen');
                        }
                    });
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        let mediaRecorder;
        let audioChunks = [];
        let recordedMimeType = '';

        navigator.mediaDevices.getUserMedia({ 
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            } 
        })
        .then(stream => {
            statusText.innerText = "Listo para transmitir";
            requestWakeLock();

            const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    recordedMimeType = type;
                    break;
                }
            }

            const recorderOptions = recordedMimeType ? { mimeType: recordedMimeType } : {};
            mediaRecorder = new MediaRecorder(stream, recorderOptions);

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blobOptions = recordedMimeType ? { type: recordedMimeType } : {};
                const audioBlob = new Blob(audioChunks, blobOptions);
                audioChunks = [];
                
                audioBlob.arrayBuffer().then(buffer => {
                    socket.emit('voice-message', {
                        username: username,
                        audioBuffer: buffer,
                        mimeType: recordedMimeType
                    });
                    statusText.innerText = "Mensaje enviado";
                    setTimeout(() => statusText.innerText = "Listo para transmitir", 1500);
                });
            };
        })
        .catch(err => {
            console.error("Error al acceder al micrófono:", err);
            statusText.innerText = "Error: Permite el acceso al micrófono";
        });

        const startRecording = (e) => {
            e.preventDefault();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => audioPlayer.pause()).catch(() => {});
            }

            if (mediaRecorder && mediaRecorder.state === "inactive") {
                audioChunks = [];
                mediaRecorder.start();
                statusText.innerText = "Transmitiendo...";
                talkBtn.style.backgroundColor = "#2ecc71";
            }
        };

        const stopRecording = (e) => {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                talkBtn.style.backgroundColor = "#e74c3c";
            }
        };

        talkBtn.addEventListener('mousedown', startRecording);
        talkBtn.addEventListener('mouseup', stopRecording);
        talkBtn.addEventListener('touchstart', startRecording);
        talkBtn.addEventListener('touchend', stopRecording);

        // ESCUCHAR AUDIO ENTRANTE (Receptor flexible con compatibilidad cruzada)
        socket.on('voice-message', (data) => {
            console.log(`Audio recibido de: ${data.username} [Tipo: ${data.mimeType}]`);
            statusText.innerText = `Recibiendo de ${data.username}...`;
            
            // Si el emisor envió un tipo MIME válido, lo respetamos; si viene vacío, dejamos que el navegador lo interprete libremente
            const blobOptions = data.mimeType ? { type: data.mimeType } : {};
            const blob = new Blob([data.audioBuffer], blobOptions);
            const audioUrl = URL.createObjectURL(blob);
            
            audioPlayer.src = audioUrl;
            audioPlayer.volume = 1.0;
            
            audioPlayer.play()
                .then(() => {
                    setTimeout(() => statusText.innerText = "Listo para transmitir", 2000);
                })
                .catch(err => {
                    console.error("Error al reproducir:", err);
                    statusText.innerText = "Toca el botón para permitir audio";
                });
        });
    </script>
</body>
</html>
